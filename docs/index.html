<title>Планирование закупок</title>

:root{--bg:#fff;--fg:#1c2024;--mut:#6b7280;--card:#f4f5f7;--line:#e2e4e9;--acc:#1f5fbf;--bad:#c0392b;--warn:#b7791f;--ok:#2f855a}
@media(prefers-color-scheme:dark){:root{--bg:#15181c;--fg:#e8eaed;--mut:#9aa0a6;--card:#1f2328;--line:#2d333b;--acc:#6aa5ff;--bad:#ff7b6b;--warn:#e0b45a;--ok:#5fcf9a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);position:relative;z-index:10;background:var(--bg)}.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:18px}.sub{color:var(--mut);font-size:12px}
.lang{display:flex;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:2px}.lang button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:4px 10px;border-radius:5px;cursor:pointer}.lang button.on{background:var(--acc);color:#fff}
.kpis{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px}.k{background:var(--card);border-radius:8px;padding:10px 14px;min-width:140px}.k b{font-size:20px;display:block}.k span{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}nav button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font:inherit}nav button.on{color:var(--fg);border-color:var(--acc)}
main{padding:14px 20px}.tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}input,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}#q{min-width:280px}.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}.btn:hover{filter:brightness(1.08)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--bg);cursor:pointer;color:var(--mut)}tr:hover td{background:var(--card)}
.n{text-align:right}.tag{padding:1px 6px;border-radius:9px;font-size:11px;background:var(--card)}.SHORTAGE{color:var(--bad)}.EXCESS{color:var(--warn)}.OK{color:var(--ok)}
.note{background:var(--card);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12.5px}.bar{height:10px;background:var(--acc);border-radius:3px;min-width:2px}
#dr{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);padding:16px;overflow:auto;display:none;box-shadow:-4px 0 16px #0003}
#dr h3{margin:0 0 6px}#dr pre{background:var(--card);padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px}#dr button{float:right}
</style></head><body>

const $=id=>document.getElementById(id);

function enumv(kind,v){
 const s=String(v);
 if(kind==='variant'){
  let m;
  if((m=s.match(/^cover_all=(\d+)d$/)))return L.dyn.coverAll(m[1]);
  if((m=s.match(/^service_level=([\d.]+)$/)))return L.dyn.serviceLevel(m[1]);
  if((m=s.match(/^demand_scale=([\d.]+)$/)))return L.dyn.demandScale(m[1]);
 }
 if(kind==='reason'){
  const m=s.match(/^NO_SALES_(\d+)M$/);
  if(m)return L.dyn.noSales(m[1]);
  return L.reason[s]||s;
 }
 if(kind==='flag')return L.flag[s]||s;
 const map=L.enums[kind]||{};
 return map[s]||s;
}
const supLabel=v=>v==null||Number.isNaN(v)||v==='UNSPECIFIED'?L.noSupplier:String(v);

function fmtDetail(r){
 const d=String(r.detail||''),m=d.match(/^(.*?) -> (.*)$/);
 if(m&&(r.change==='ACTION_CHANGED'||r.change==='RISK_CHANGED'))return enumv(r.change==='ACTION_CHANGED'?'action':'risk',m[1])+' → '+enumv(r.change==='ACTION_CHANGED'?'action':'risk',m[2]);

}
function cell(r,k){
 if(k==='bar')return r.bar||'';
 const v=r[k];
 if(v==null||v==='')return '—';
 if(k==='supplier_id')return esc(supLabel(v));
 if(k==='risk')return `<span class="${esc(v)}">${esc(enumv('risk',v))}</span>`;
 if(k==='reason_codes')return esc(v.split('|').filter(Boolean).map(x=>enumv('reason',x)).join('; '));
 if(k==='flags')return esc(v.split('|').filter(Boolean).map(x=>enumv('flag',x)).join('; '));
 if(k==='flag')return esc(enumv('flag',v));
 if(k==='detail')return esc(fmtDetail(r));
 if(ENUMS.has(k))return esc(enumv(k,v));
 return esc(String(v));
}

function buyNowCsv(){
 const head=[L.csv.supplier,L.csv.category,'SKU',L.csv.qty];
 const supKey=r=>{const s=supLabel(r.supplier_id);return s===L.noSupplier?'\uffff':s};
 const catKey=r=>String(enumv('category',r.category));
 const rows=rowsOf(['BUY_NOW']).slice().sort((a,b)=>supKey(a).localeCompare(supKey(b),loc())||catKey(a).localeCompare(catKey(b),loc())||String(a.sku_id).localeCompare(String(b.sku_id)));
 return '\uFEFF'+[head].concat(rows.map(r=>[supLabel(r.supplier_id),enumv('category',r.category),r.sku_id,Math.round(r.qty_recommended||0)])).map(row=>row.map(csvCell).join(';')).join('\r\n');

function bindList(rows,cols){
 const draw=()=>{
  const q=($('q')?.value||'').toLowerCase(),c=$('cat')?.value||'';
  let r=rows.filter(x=>(!c||x.category===c)&&(!q||hay(x).includes(q)));
  if(sortK)r=[...r].sort((a,b)=>((a[sortK]??-1e18)>(b[sortK]??-1e18)?1:-1)*sortD);
  $('tb').innerHTML=table(r.slice(0,400),cols,{drill:true});
  document.querySelectorAll('#tb th').forEach(h=>h.onclick=()=>{sortD=sortK===h.dataset.k?-sortD:-1;sortK=h.dataset.k;draw()});
 };
 $('q').oninput=draw;$('cat').onchange=draw;draw();
}
const toks=(s,kind)=>(s||'').split('|').filter(Boolean).map(x=>enumv(kind,x)).join(' ');
const hay=x=>[x.sku_id,x.category,enumv('category',x.category),x.supplier_id,supLabel(x.supplier_id),x.flags,toks(x.flags,'flag'),x.reason_codes,toks(x.reason_codes,'reason'),x.action,enumv('action',x.action),x.risk,enumv('risk',x.risk)].join(' ').toLowerCase();
const rowsOf=a=>D.rec.filter(r=>a.includes(r.action)).sort((x,y)=>y.priority-x.priority);
const TABS={
 buyNow:()=>{$('main').innerHTML=listView(`<button class="btn" onclick="exportBuyNow()">${esc(L.csv.export)}</button>`);bindList(rowsOf(['BUY_NOW']),COLS.rc)},
 planned:()=>{$('main').innerHTML=listView();bindList(rowsOf(['BUY_LATER']).sort((a,b)=>a.next_order_in_days-b.next_order_in_days),COLS.planned)},
 calendar:()=>{const m=Math.max(...D.calendar.map(c=>c.units||0),1);const rows=D.calendar.map(c=>({...c,bar:`<div class="bar" style="width:${Math.max(2,(c.units||0)/m*240)}px"></div>`}));$('main').innerHTML=L.notes.calendar(D)+table(rows,COLS.calendar)},
 suppliers:()=>{$('main').innerHTML=L.notes.suppliers(D)+table(D.suppliers,COLS.suppliers)},
 risks:()=>{$('main').innerHTML=listView();bindList(D.rec.filter(r=>r.risk==='SHORTAGE'||r.risk==='EXCESS').sort((a,b)=>(a.risk>b.risk?1:-1)||b.priority-a.priority),COLS.risk)},
 review:()=>{$('main').innerHTML=L.notes.review(D)+listView();bindList(rowsOf(['REVIEW_ASSORTMENT','MANUAL_CHECK','DEAD_STOCK']),COLS.review)},
 delta:()=>{$('main').innerHTML=D.delta.length?L.notes.delta(D)+table(D.delta,COLS.delta):L.notes.deltaEmpty(D)},
 quality:()=>{$('main').innerHTML=L.notes.quality(D)+`<h3>${esc(L.flagsHeading)}</h3>`+table(D.flagCounts,COLS.flags)},
 backtest:()=>{$('main').innerHTML=L.notes.backtest(D)+table(D.backtest,COLS.backtest)+`<h3>${esc(L.sensHeading)}</h3>`+table(D.sens,COLS.sens)}
};
function renderKpis(){
 const buy=rowsOf(['BUY_NOW']);
 const kp=[
  [L.kpi.buyNow,buy.length+' SKU'],
  [L.kpi.units,f0(buy.reduce((s,r)=>s+(r.qty_recommended||0),0))],
  [L.kpi.weight,f1(buy.reduce((s,r)=>s+(r.kg_order||0),0)/1000)],
  [L.kpi.shortage,D.rec.filter(r=>r.risk==='SHORTAGE').length],
  [L.kpi.excess,D.rec.filter(r=>r.risk==='EXCESS').length],
  [L.kpi.review,rowsOf(['REVIEW_ASSORTMENT']).length],
  [L.kpi.manual,rowsOf(['MANUAL_CHECK']).length],
  [L.kpi.dead,rowsOf(['DEAD_STOCK']).length],
  [L.kpi.stalePo,D.rec.filter(r=>(r.flags||'').includes('STALE_PO')).length]
 ];
 $('kpis').innerHTML=kp.map(k=>`<div class="k"><b>${k[1]}</b><span>${esc(k[0])}</span></div>`).join('');
}
function renderNav(){
 const nav=$('nav');nav.innerHTML='';
 Object.keys(TABS).forEach(k=>{
  const b=document.createElement('button');b.textContent=L.tabs[k]||k;b.className=k===curTab?'on':'';
  b.onclick=()=>{curTab=k;sortK=null;[...nav.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');TABS[k]()};
  nav.appendChild(b);
 });
}
function drill(id){
 const r=D.rec.find(x=>x.sku_id===id);if(!r)return;
 const reasons=(r.reason_codes||'').split('|').filter(Boolean).map(x=>enumv('reason',x)).join('; ')||'—';
 const flags=(r.flags||'').split('|').filter(Boolean).map(x=>enumv('flag',x)).join('; ')||'—';
 const lines=[
  L.drill.skuLine(r),'',
  `${L.drill.action}: ${enumv('action',r.action)}   ${L.drill.risk}: ${enumv('risk',r.risk)}`,
  `${L.drill.reasons}: ${reasons}`,
  `${L.drill.flags}: ${flags}`,'',
  L.drill.stock(r),L.drill.pipeline(r),
  L.drill.lead(r),'',
  L.drill.demand(r),L.drill.forecast(r),L.drill.ss(r),L.drill.target(r),
  L.drill.proj(r),L.drill.qty(r),'',
  L.drill.stockout(r),L.drill.order(r),
  L.drill.meta(r)
 ];
 $('dr').style.display='block';
 $('dr').innerHTML=`<button onclick="this.parentNode.style.display='none'">✕</button><h3>${esc(L.drillTitle)}</h3><pre>${esc(lines.join('\n'))}</pre>`;
}
function setLang(l){LANG=l;try{localStorage.setItem('procure_lang',l)}catch(e){}render()}
function render(){
 L=I18N[LANG]||I18N.ru;
 document.documentElement.lang=LANG;document.title=L.title;
 $('title').textContent=L.title;
 $('sub').textContent=L.sub(D);
 $('lang').innerHTML=`<button class="${LANG==='ru'?'on':''}" onclick="setLang('ru')" title="Русский" aria-label="Русский">RU</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')" title="English" aria-label="English">EN</button>`;
 renderKpis();renderNav();$('dr').style.display='none';TABS[curTab]();
}
render();
</script></body></html>
