<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Планирование закупок</title>
<style>
:root{--bg:#fff;--fg:#1c2024;--mut:#6b7280;--card:#f4f5f7;--line:#e2e4e9;--acc:#1f5fbf;--bad:#c0392b;--warn:#b7791f;--ok:#2f855a}
@media(prefers-color-scheme:dark){:root{--bg:#15181c;--fg:#e8eaed;--mut:#9aa0a6;--card:#1f2328;--line:#2d333b;--acc:#6aa5ff;--bad:#ff7b6b;--warn:#e0b45a;--ok:#5fcf9a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:18px}.sub{color:var(--mut);font-size:12px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px}.k{background:var(--card);border-radius:8px;padding:10px 14px;min-width:140px}.k b{font-size:20px;display:block}.k span{color:var(--mut);font-size:12px}
nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}nav button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font:inherit}nav button.on{color:var(--fg);border-color:var(--acc)}
main{padding:14px 20px}.tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}input,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--bg);cursor:pointer;color:var(--mut)}tr:hover td{background:var(--card)}
.n{text-align:right}.tag{padding:1px 6px;border-radius:9px;font-size:11px;background:var(--card)}.SHORTAGE{color:var(--bad)}.EXCESS{color:var(--warn)}.OK{color:var(--ok)}
.note{background:var(--card);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12.5px}.bar{height:10px;background:var(--acc);border-radius:3px;min-width:2px}
#dr{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);padding:16px;overflow:auto;display:none;box-shadow:-4px 0 16px #0003}
#dr h3{margin:0 0 6px}#dr pre{background:var(--card);padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px}#dr button{float:right}
</style></head><body>
<header><h1>Планирование закупок — рекомендации</h1><div class="sub" id="sub"></div></header>
<div class="kpis" id="kpis"></div><nav id="nav"></nav><main id="main"></main><aside id="dr"></aside>
<script>
const D=/*__DATA__*/null;
const f0=x=>x==null?'—':Math.round(x).toLocaleString('ru'),f1=x=>x==null?'—':(+x).toFixed(1);
const $=id=>document.getElementById(id);
$('sub').textContent=`as-of ${D.meta.as_of} · run ${D.manifest.run_id} · конфиг ${D.manifest.config_hash} · z=${D.meta.z.toFixed(2)}`;
const cnt=a=>D.rec.filter(r=>r.action==a),buy=cnt('BUY_NOW');
const kp=[['К закупке сейчас',buy.length+' SKU'],['Штук',f0(buy.reduce((s,r)=>s+r.qty_recommended,0))],['Вес, т',f1(buy.reduce((s,r)=>s+(r.kg_order||0),0)/1000)],['Риск дефицита',D.rec.filter(r=>r.risk=='SHORTAGE').length],['Риск избытка',D.rec.filter(r=>r.risk=='EXCESS').length],['Ревизия наценки',cnt('REVIEW_ASSORTMENT').length],['Ручная проверка',cnt('MANUAL_CHECK').length],['Мёртвый сток',cnt('DEAD_STOCK').length],['Просроч. PO (stale)',D.rec.filter(r=>(r.flags||'').includes('STALE_PO')).length]];
$('kpis').innerHTML=kp.map(k=>`<div class="k"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('');
let sortK=null,sortD=-1;
function table(rows,cols,opts={}){const id='t'+Math.random().toString(36).slice(2);
 return `<div class="wrap"><table id="${id}"><thead><tr>${cols.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ${opts.drill?`onclick="drill('${r.sku_id}')" style="cursor:pointer"`:''}>${cols.map(c=>`<td class="${c[2]=='n'?'n':''} ${c[0]=='risk'?r.risk:''}">${c[2]=='n'?f0(r[c[0]]):(r[c[0]]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const RC=[['sku_id','SKU'],['category','Категория'],['supplier_id','Поставщик'],['priority','Приор.','n'],['qty_recommended','Заказать','n'],['order_date','Дата заказа'],['stock_asof','Остаток','n'],['pipeline_eff','В пути (эфф.)','n'],['cover_with_pipeline_days','Покрытие, дн','n'],['lead_days','Плечо','n'],['risk','Риск'],['reason_codes','Причины'],['flags','Флаги']];
function listView(rows,cols,extra=''){return `<div class="tools"><input id="q" placeholder="поиск: SKU / категория / поставщик / флаг"><select id="cat"><option value="">все категории</option>${[...new Set(D.rec.map(r=>r.category))].map(c=>`<option>${c}</option>`).join('')}</select><span class="sub">${extra}</span></div><div id="tb"></div>`}
function bindList(rows,cols){const draw=()=>{const q=$('q').value.toLowerCase(),c=$('cat').value;let r=rows.filter(x=>(!c||x.category==c)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));if(sortK)r=[...r].sort((a,b)=>((a[sortK]??-1e18)>(b[sortK]??-1e18)?1:-1)*sortD);$('tb').innerHTML=table(r.slice(0,400),cols,{drill:true});document.querySelectorAll('#tb th').forEach(h=>h.onclick=()=>{sortD=sortK==h.dataset.k?-sortD:-1;sortK=h.dataset.k;draw()})};$('q').oninput=draw;$('cat').onchange=draw;draw()}
const rowsOf=a=>D.rec.filter(r=>a.includes(r.action)).sort((x,y)=>y.priority-x.priority);
const TABS={
 'Закупка сейчас':()=>{$('main').innerHTML=listView()+'';bindList(rowsOf(['BUY_NOW']),RC)},
 'Запланировано':()=>{$('main').innerHTML=listView();bindList(rowsOf(['BUY_LATER']).sort((a,b)=>a.next_order_in_days-b.next_order_in_days),RC)},
 'Календарь заказов':()=>{const m=Math.max(...D.calendar.map(c=>c.units),1);$('main').innerHTML=`<div class="note">Недели размещения заказов по формуле «дата, когда проекция остатка достигает точки заказа минус плечо». Включает BUY_NOW (текущая неделя) и BUY_LATER.</div>`+table(D.calendar.map(c=>({...c,bar:`<div class="bar" style="width:${Math.max(2,c.units/m*240)}px"></div>`})),[['week','Неделя'],['skus','SKU','n'],['units','Штук','n'],['kg','Вес, кг','n'],['bar','']])},
 'Поставщики':()=>{$('main').innerHTML=`<div class="note">Готовый «пакет заказа» по BUY_NOW. <b>Ограничение данных:</b> weight_kg заполнен только у 7 из 791 SKU, объёма нет — загрузка контейнеров на этих данных НЕ считается (колонки веса — только по SKU с весом). Для планирования используйте штуки и справочник габаритов, когда он появится.</div>`+table(D.suppliers,[['supplier_id','Поставщик'],['skus','SKU','n'],['units','Штук','n'],['kg','Вес, кг','n'],['containers_by_weight_lb','Контейнеров (≥)','n'],['skus_no_weight','SKU без веса','n'],['shortage_skus','В дефиците','n']])},
 'Риски':()=>{$('main').innerHTML=listView();bindList(D.rec.filter(r=>r.risk=='SHORTAGE'||r.risk=='EXCESS').sort((a,b)=>(a.risk>b.risk?1:-1)||b.priority-a.priority),[...RC.slice(0,3),['risk','Риск'],['stock_asof','Остаток','n'],['pipeline_eff','В пути','n'],['days_to_stockout','До дефицита, дн','n'],['cover_with_pipeline_days','Покрытие, дн','n'],['lead_days','Плечо','n'],['cover_policy_days','Политика покрытия','n'],['action','Действие'],['reason_codes','Причины']])},
 'Пересмотр / ручная проверка':()=>{$('main').innerHTML=`<div class="note">REVIEW_ASSORTMENT — наценка &lt; порога (не в авто-закупку). MANUAL_CHECK — нет себестоимости или остаток не верифицирован. DEAD_STOCK — нет продаж ${D.cfg.dead_months} мес., остаток &gt; 0.</div>`+listView();bindList(rowsOf(['REVIEW_ASSORTMENT','MANUAL_CHECK','DEAD_STOCK']),[['sku_id','SKU'],['category','Категория'],['action','Класс'],['markup_pct','Наценка %','n'],['stock_asof','Остаток','n'],['sold_12m','Продано 12м','n'],['qty_would_buy','Было бы к закупке','n'],['reason_codes','Причины'],['flags','Флаги']])},
 'Что изменилось':()=>{$('main').innerHTML=D.delta.length?`<div class="note">Сравнение с запуском ${D.manifest.prev_run||'—'}.</div>`+table(D.delta,[['sku_id','SKU'],['change','Изменение'],['detail','Детали']]):'<div class="note">Предыдущего запуска нет — дельта появится после следующего прогона.</div>'},
 'Качество данных и допущения':()=>{$('main').innerHTML=`<div class="note"><b>Правила:</b> единая дата среза ${D.meta.as_of}; остаток = снимок(1-е) − net-продажи(1..as-of) + приходы(1..as-of); отсутствие строки остатка = 0 (экспорт без нулей); неполный месяц в фит не идёт; net = sold − returned.</div>
 <div class="note"><b>Открытые PO:</b> ${JSON.stringify(D.meta.open_po_states)}; в пути номинально ${f0(D.meta.open_po_pending_total)} шт, учтено с коэффициентами ${f0(D.meta.open_po_effective_total)} шт. Сверка с sku_dim.on_order_qty = ${f0(D.meta.on_order_qty_check)} (один источник — дубля нет).</div>
 <div class="note"><b>Допущения (ASSUMPTION):</b> покрытие по категориям ${JSON.stringify(D.cfg.cover_days_by_category)}; service level ${D.cfg.service_level}; запас на срыв срока ${D.cfg.lead.slip_buffer_days} дн.; min наценка ${D.cfg.min_markup_pct}%.</div>`+'<h3>Флаги</h3>'+table(D.flagCounts,[['flag','Флаг'],['n','SKU','n']])},
 'Backtest и чувствительность':()=>{$('main').innerHTML='<div class="note">Rolling-origin backtest, горизонт 6 мес. Baseline обязателен. Известное ограничение: на string_trimmers и space_heaters seasonal_naive точнее модели по WAPE; у модели положительное смещение (~+17%) — прогноз консервативный (см. demand_scale в конфиге). fill_proxy/excess_ratio — оценка без учёта стартового остатка.</div>'+table(D.backtest,[['model','Модель'],['n','Наблюдений','n'],['wape','WAPE'],['bias','Смещение'],['fill_proxy','Fill proxy'],['excess_ratio','Excess']])+'<h3>Чувствительность к допущениям</h3>'+table(D.sens,[['variant','Вариант'],['buy_now_skus','SKU к закупке','n'],['buy_now_units','Штук','n'],['buy_now_kg','Вес, кг','n'],['shortage_skus','Дефицит','n'],['excess_skus','Избыток','n']])}
};
function drill(id){const r=D.rec.find(x=>x.sku_id==id);if(!r)return;const T=[
`SKU ${r.sku_id} · ${r.category} · ${r.supplier_id} (${r.supply_type})`,'',
`Действие: ${r.action}   Риск: ${r.risk}`,`Причины: ${r.reason_codes}`,`Флаги: ${r.flags||'—'}`,'',
`Остаток на as-of: ${f0(r.stock_asof)} = снимок ${f0(r.snapshot)} − продажи(неполн.мес.) ${f0(r.sold_partial)} + приходы ${f0(r.rc_partial)}  [${r.stock_state}]`,
`В пути: номинал ${f0(r.pipeline_nominal)}, эффективно ${f1(r.pipeline_eff)}${r.stale_po_qty?`, просрочено >${D.cfg.po.stale_days}д (не учтено) ${f0(r.stale_po_qty)}`:''}`,
`Плечо L=${r.lead_days} дн [${r.lead_src}], покрытие C=${r.cover_policy_days} дн (допущение)`,'',
`Спрос: level=${f1(r.level_m)} шт/мес (десезон.), σ=${f1(r.sigma_m)}`,`Прогноз за L: ${f1(r.forecast_L)}; за [L, L+C]: ${f1(r.forecast_cover)}`,
`Safety stock = z(${r.z}) · σ · √(Σ сезонн. месяцев за L+slip) = ${f1(r.safety_stock)}`,`target = ${f1(r.forecast_cover)} + ${f1(r.safety_stock)} = ${f1(r.target)}`,
`Прогноз остатка к приходу заказа: ${f1(r.proj_at_arrival)}`,`qty_raw = max(0, target − proj) = ${f1(r.qty_raw)}  → с партионностью (мин.партия ${f0(r.min_batch)}, кратность ${r.lot}) = ${f0(r.qty_would_buy)}`,'',
`Дней до дефицита (с pipeline): ${r.days_to_stockout??'—'}; покрытие по формуле остаток/ср.спрос: ${r.cover_formula_days??'—'}`,`Заказать через: ${r.next_order_in_days??'—'} дн → ${r.order_date||'—'}`,
`Наценка: ${r.markup_pct??'нет данных'}%  ·  вес ед.: ${r.weight_kg??'нет'} кг  ·  decile цены ${r.price_decile??'—'}  ·  приоритет ${r.priority}`];
$('dr').style.display='block';$('dr').innerHTML=`<button onclick="this.parentNode.style.display='none'">✕</button><h3>Расчёт</h3><pre>${T.join('\n')}</pre>`}
const nav=$('nav');Object.keys(TABS).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');sortK=null;TABS[k]()};nav.appendChild(b);if(!i)b.click()});
</script></body></html>
